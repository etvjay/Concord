name: tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    # TUNNEL_ARGS should be a remotely-managed named tunnel command, for example:
    # tunnel --no-autoupdate run --token <token>
    # The quick-tunnel fallback remains useful for local inspection only; it
    # must not be used when registering a Coston2 FCC machine.
    command: ${TUNNEL_ARGS:-tunnel --no-autoupdate --url ${TUNNEL_TARGET:-http://host.docker.internal:6674}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
