  verified_facts:
    - Coston2 uses chain ID 114 and the configured public RPC.
    - The official Coston2 FCC development walkthrough uses LOCAL_MODE=false and SIMULATED_TEE=true.
    - The walkthrough requires a public HTTPS extension-proxy URL and Coston2 indexer database credentials for the local proxy.
    - The current scaffold path includes pre-build, start-services, post-build, and test phases.
    - Flare's FAQ identifies Coston2 as the primary dApp testnet and states that FCC is available there while in development.
    - FCC development registration requires one active machine in status 2 (PRODUCTION), a fresh availability check, a registered teeId, and a reachable stable public HTTPS extension URL.
    - The extension receives provider delivery at the scaffold external proxy port 6664; the Docker host mapping used by this repository is 6674.
    - Rotating quick-tunnel URLs are not valid for a registered Coston2 machine; the named tunnel token form is `run --token <token>`.
    - The official Coston2 FTDC proxy endpoints are `https://tee-proxy-coston2-1.flare.rocks` and `https://tee-proxy-coston2-2.flare.rocks`; they are normal infrastructure proxies, not Concord's extension endpoint.
    - The current DevHub walkthrough specifies the Coston2 indexer endpoint as host `34.38.42.208`, port `3306`, database `indexer`; credentials remain secret inputs.
  contradictions:
    - id: FCC-QUICK-TUNNEL-SCOPE
      statement: The DevHub getting-started walkthrough still documents quick tunnels for development and says to update EXT_PROXY_URL when a quick-tunnel URL changes.
      current_operational_constraint: A registered Coston2 machine must use one stable public HTTPS URL; restarting a rotating tunnel strands the onchain machine record and can create a new simulated TEE identity.
      resolution: Concord permits quick tunnels only for unregistered smoke tests and requires a stable named-tunnel URL/token for the guarded registration workflow.
    - id: FCC-WORKERS-DEV-INGRESS-FALLBACK
      statement: The official path requires a stable public HTTPS extension-proxy URL; a named Cloudflare Tunnel is one supported way to provide it.
      current_operational_constraint: This account cannot self-assign the Cloudflare Connectivity Directory Admin role required for the VPC/tunnel path, and no custom domain is available.
      resolution: Concord uses the stable Workers.dev URL `https://concord-fcc-ingress.microcosm.workers.dev` as a narrow development relay to the disposable Codespace public port. It forwards `/instruction`, `/info`, `/health`, `/metrics`, `/action/status...`, and `/action/result...`; it is not represented as a named tunnel or production ingress.
  concord_decisions:
    - No product-semantic contradiction was found.
    - Simulated TEE evidence remains development-path evidence, not production hardware-backed confidentiality.
    - FDC remains an evidence seam and is not added to the MVP.
