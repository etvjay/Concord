name: Coston2 asset resolution\n\non:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  resolve:\n    name: Resolve official Coston2 asset bindings\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Install Foundry\n        uses: foundry-rs/foundry-toolchain@v1\n        with:\n          version: stable\n      - name: Resolve and validate Coston2 assets\n        run: bash scripts/resolve-coston2-assets.sh\n