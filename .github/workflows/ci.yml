name: Concord verification

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.1"
  NODE_VERSION: "22.10.0"

jobs:
  solidity:
    name: Solidity / Foundry
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Show toolchain
        run: forge --version
      - name: Check Solidity formatting
        run: forge fmt --check
      - name: Run Solidity lifecycle tests
        run: forge test -vvv

  go:
    name: Go extension and tooling
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go/go.sum
            tools/go.sum
      - name: Test Concord FCC extension
        working-directory: go
        env:
          GOTOOLCHAIN: local
        run: go test ./...
      - name: Test deployment, verifier, API and MCP tooling
        working-directory: tools
        env:
          GOTOOLCHAIN: local
        run: go test ./...
      - name: Check Flare dependency pin consistency
        run: bash scripts/check-versions.sh

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build SDK declarations
        working-directory: sdk/typescript
        run: npm run build

  repository:
    name: Repository and documentation gates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse shell scripts
        run: find scripts -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n
      - name: Validate Concord documentation contract
        run: bash scripts/check-docs.sh

  coston2-assets:
    name: Coston2 asset resolution (manual)
    if: github.event_name == "workflow_dispatch"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Resolve and validate Coston2 assets
        run: bash scripts/resolve-coston2-assets.sh
