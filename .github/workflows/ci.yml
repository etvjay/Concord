name: Concord verification\n\non:\n  push:\n    branches:\n      - main\n      - agent/concord-rebuild\n  pull_request:\n    branches:\n      - main\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  solidity:\n    name: Solidity / Foundry\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Install Foundry\n        uses: foundry-rs/foundry-toolchain@v1\n        with:\n          version: stable\n      - name: Show toolchain\n        run: forge --version\n      - name: Check Solidity formatting\n        run: forge fmt --check\n      - name: Run Solidity lifecycle tests\n        run: forge test -vvv\n\n  go:\n    name: Go extension and tooling\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Install Go 1.25.1\n        uses: actions/setup-go@v5\n        with:\n          go-version: "1.25.1"\n          cache: false\n      - name: Test Concord FCC extension\n        working-directory: go\n        env:\n          GOTOOLCHAIN: local\n        run: go test ./...\n      - name: Test deployment, verifier, API and MCP tooling\n        working-directory: tools\n        env:\n          GOTOOLCHAIN: local\n        run: go test ./...\n      - name: Check Flare dependency pin consistency\n        run: bash scripts/check-versions.sh\n\n  sdk:\n    name: TypeScript SDK\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Install Node.js 22.10.0\n        uses: actions/setup-node@v4\n        with:\n          node-version: "22.10.0"\n      - name: Install SDK dependencies\n        working-directory: sdk/typescript\n        run: npm install --ignore-scripts --no-audit --no-fund\n      - name: Build SDK declarations\n        working-directory: sdk/typescript\n        run: npm run build\n\n  repository:\n    name: Repository and documentation gates\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Parse shell scripts\n        run: find scripts -type f -name "*.sh" -print0 | xargs -0 -n1 bash -n\n      - name: Validate Concord documentation contract\n        run: bash scripts/check-docs.sh\n