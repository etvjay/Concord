name: Concord frontend

on:
  push:
    paths:
      - "frontend/**"
      - "sdk/typescript/**"
      - "config/coston2/concord-deployment.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "sdk/typescript/**"
      - "config/coston2/concord-deployment.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, test, and build
        working-directory: frontend
        run: |
          npm run build
          npm test
      - name: Build production container
        run: docker build -f frontend/Dockerfile -t concord-frontend:${{ github.sha }} .
